name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: twofold
          POSTGRES_PASSWORD: twofold
          POSTGRES_DB: twofold
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twofold -d twofold"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://twofold:twofold@localhost:5432/twofold?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.29.0"

      - name: Check generated sqlc is fresh
        working-directory: backend
        run: |
          sqlc generate
          pkgs="internal/user/userdb internal/session/sessiondb internal/audit/auditdb internal/ledger/ledgerdb internal/wallet/walletdb internal/idempotency/idempotencydb internal/transfer/transferdb internal/fee/feedb internal/limit/limitdb internal/kyc/kycdb"
          if ! git diff --quiet -- $pkgs; then
            echo "sqlc output is stale — run sqlc generate and commit generated packages"
            git diff -- $pkgs
            exit 1
          fi

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Migrate up / down / up
        working-directory: backend
        run: |
          go run ./cmd/migrate -command=up -dir=migrations
          go run ./cmd/migrate -command=down -dir=migrations
          go run ./cmd/migrate -command=up -dir=migrations

      - name: Test
        working-directory: backend
        # -p 1: one shared Postgres service — avoid migrate/user package races.
        # The 1,000-transfer suite runs in its own step, 20× with -race.
        run: go test -p 1 ./... -skip '^TestConcurrency'

      - name: Concurrency suite ×20 (race)
        working-directory: backend
        timeout-minutes: 45
        run: go test -race -count=20 -timeout 40m -p 1 ./internal/transfer/ -run '^TestConcurrency'

      - name: Ledger properties ×1000
        working-directory: backend
        # Pure applyLines/NewJournal properties + post integration (shared tx).
        # reverse/overdraft at this scale are ApplyLines* properties; the DB
        # variants still run in the Test step at rapid's default check count.
        timeout-minutes: 1
        run: >-
          go test ./internal/ledger/ -count=1 -parallel 1 -timeout 60s
          -run 'TestProperty(Valid|Invalid|Flip|BalanceDelta|ApplyLines|LedgerInvariants)'
          -rapid.checks=1000
